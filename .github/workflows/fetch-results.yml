name: Fetch Premier League results

on:
  schedule:
    # Check once per hour at minute 17 UTC.
    # Only matches marked FINISHED by football-data.org are imported.
    - cron: '17 * * * *'

  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (look, do not write)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: premier-league-result-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and write results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.TK }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          DRY_RUN: ${{ inputs.dry || false }}
        run: node scripts/fetch-results.mjs
