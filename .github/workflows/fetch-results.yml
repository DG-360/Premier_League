name: Fetch Premier League results

on:
  schedule:
    # every 3 hours, UTC. GitHub can run these a few minutes late — that's fine.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (look, do not write)'
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and write results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          DRY_RUN: ${{ inputs.dry }}
        run: node scripts/fetch-results.mjs
