name: Update Betable model

on:
  schedule:
    # Rebuild once per hour after the result-fetch workflow.
    # Injury / manager / formation context is applied instantly in the website.
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betable-model
  cancel-in-progress: false

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install model dependencies
        run: python -m pip install --upgrade pandas numpy scikit-learn

      - name: Train, test and publish Betable probabilities
        env:
          FIREBASE_DB_URL: https://world-cup-2026-predictio-7c7b2-default-rtdb.firebaseio.com
        run: python scripts/bettable_model.py --repo-root . --publish

      - name: Upload model diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: betable-model-diagnostics
          path: model_output/
          if-no-files-found: warn
